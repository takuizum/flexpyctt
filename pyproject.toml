[project]
name = "flexpyctt"
dynamic = ["version"]
description = "Model-free item and test analysis: polychoric correlations, dimensionality diagnostics and classical item analysis, without JAX."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "takuizum" }]
keywords = [
    "psychometrics",
    "classical test theory",
    "polychoric correlation",
    "parallel analysis",
    "factor analysis",
    "dimensionality",
    "item analysis",
    "reliability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.urls]
Homepage = "https://github.com/takuizum/flexpyctt"
Documentation = "https://takuizum.github.io/flexpyirt/"
Repository = "https://github.com/takuizum/flexpyctt"
Issues = "https://github.com/takuizum/flexpyctt/issues"
Releases = "https://github.com/takuizum/flexpyctt/releases"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the latest vX.Y.Z git tag (CONTRIBUTING.md "Releases").
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/flexpyctt"]

# The sdist carries the sources, the tests (with the R reference values) and the R scripts.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/validation", "/README.md", "/README.ja.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "D"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # allow Japanese / math characters in strings and comments
    "N803", "N806",                # allow math-style capital names (Q, J, ...)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/flexpyctt", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-n", "auto", "--dist", "loadfile"]
markers = [
    "slow: takes more than ~5 s; skipped on PR/push CI, run nightly and on release PRs. Deselect locally with -m 'not slow'.",
]
xfail_strict = true
