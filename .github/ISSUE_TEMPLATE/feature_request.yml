name: Feature request / 機能の提案
description: Propose a new statistic, option or API / 新しい統計量・オプション・API の提案
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do / やりたいこと
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: References (papers, the corresponding R function, ...) / 参照（論文・R の対応する関数など）
